[project]
name = "fkl"
version = "0.1.0"
description = "Fact Knowledge Layer: grounded facts from PDFs with cross-document reconciliation"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
isort = { known-first-party = ["fkl"] }
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fkl"]
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[[tool.mypy.overrides]]
module = "fkl.pdf"
disallow_untyped_calls = false
