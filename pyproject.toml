[project]
name = "fkl"
version = "0.1.0"
description = "Fact Knowledge Layer: grounded facts from PDFs with cross-document reconciliation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.117",
    "pymupdf>=1.26",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic==1.4.0",
    "httpx==0.28.1",
    "openai>=1.50",
    "rapidfuzz>=3.10",
    "python-multipart>=0.0.12",
    "supabase>=2.10",
]

[project.optional-dependencies]
dev = ["uvicorn[standard]>=0.30", "pytest>=8.3", "httpx>=0.27", "ruff>=0.7", "mypy>=1.13"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
isort = { known-first-party = ["fkl"] }
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fkl"]
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[[tool.mypy.overrides]]
module = "fkl.pdf"
disallow_untyped_calls = false
